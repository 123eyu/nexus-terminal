<style>
  #elegant-network-container {
    width: 100%;
    height: 100%;
    background-color: #1d2331;
    overflow: hidden;
    position: relative;
  }
  #elegant-network-canvas {
    display: block;
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
  }
</style>
<div id="elegant-network-container">
  <canvas id="elegant-network-canvas"></canvas>
</div>
<script>
(function() {
  const canvas = document.getElementById('elegant-network-canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  if (!ctx) return;

  const container = canvas.parentElement;
  let width = 0;
  let height = 0;
  let animationFrameId = null;

  const numNodes = 45;
  const nodes = [];

  class CanvasNode {
    constructor(w, h) {
      this.x = Math.random() * (w || 300);
      this.y = Math.random() * (h || 200);
      this.vx = (Math.random() - 0.5) * 0.35;
      this.vy = (Math.random() - 0.5) * 0.35;
      this.radius = 1.2 + Math.random() * 2.0;
      const baseR = 130 + Math.floor(Math.random() * 50);
      const baseG = 160 + Math.floor(Math.random() * 50);
      const baseB = 210 + Math.floor(Math.random() * 45);
      const alpha = 0.4 + Math.random() * 0.45;
      this.color = 'rgba(' + baseR + ',' + baseG + ',' + baseB + ',' + alpha.toFixed(2) + ')';
    }
    update(w, h) {
      this.x += this.vx;
      this.y += this.vy;
      if (this.x < 0 || this.x > w) this.vx *= -1;
      if (this.y < 0 || this.y > h) this.vy *= -1;
    }
    draw(context) {
      context.beginPath();
      context.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
      context.fillStyle = this.color;
      context.fill();
    }
  }

  function resize() {
    if (!container) return;
    const rect = container.getBoundingClientRect();
    width = Math.floor(rect.width) || 300;
    height = Math.floor(rect.height) || 200;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    if (nodes.length === 0) {
      for (let i = 0; i < numNodes; i++) {
        nodes.push(new CanvasNode(width, height));
      }
    }
  }

  function render() {
    ctx.clearRect(0, 0, width, height);

    // 仅绘制光粒，不绘制任何连线
    for (let i = 0; i < nodes.length; i++) {
      nodes[i].update(width, height);
      nodes[i].draw(ctx);
    }

    animationFrameId = requestAnimationFrame(render);
  }

  resize();
  render();

  window.addEventListener('resize', resize);
  canvas.cleanup = function() {
    if (animationFrameId) cancelAnimationFrame(animationFrameId);
    window.removeEventListener('resize', resize);
  };
})();
</script>
