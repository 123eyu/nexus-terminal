name: CI

# 项目此前没有任何自动回归保护：只有 2 个测试文件、没有 vitest、npm test 直接 exit 1。
# 这一层先做最便宜也最有效的三件事：类型检查、设置 schema 漂移、构建可行性。
# 都不跑测试数据、不需要密钥、10 分钟内能跑完。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: Typecheck & Schema Drift
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出仓库源码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 设置项 schema 漂移检查
        run: npm run settings:check

      - name: i18n 体检（重复键 / 代码引用了不存在的键）
        run: npm run i18n:check

      - name: 单元测试（前端纯函数 + 后端租约/快照剔除）
        run: npm test

      - name: 后端类型检查
        run: npm run --prefix packages/backend typecheck

      - name: 前端类型检查
        run: npm run --prefix packages/frontend typecheck

      - name: 前端生产构建（es2022 目标 + IronRDP/noVNC 分包）
        run: npm run build --prefix packages/frontend

  docker-image:
    name: Docker Image (4-in-1 单容器)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 检出仓库源码
        uses: actions/checkout@v4

      - name: 准备构建期 .env
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: 配置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: nexus-terminal:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 冒烟测试（容器起得来 + 前端托管生效）
        run: |
          docker run -d --name nexus-ci -p 3001:3001 nexus-terminal:ci
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3001/ -o /tmp/index.html 2>/dev/null; then ok=1; break; fi
            sleep 2
          done
          echo "===== 容器日志 ====="
          docker logs nexus-ci 2>&1 | tail -40
          if [ "$ok" != "1" ]; then
            docker rm -f nexus-ci >/dev/null 2>&1 || true
            echo "❌ 容器 60s 内没有响应 GET /"
            exit 1
          fi
          grep -q '<div id="app">' /tmp/index.html
          echo "✅ 前端静态产物已由后端托管"
          docker rm -f nexus-ci >/dev/null 2>&1 || true
