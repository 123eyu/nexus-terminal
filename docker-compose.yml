services:
  nexus-terminal:
    image: heavrnl/nexus-terminal:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexus-terminal
    ports:
      - "18111:3001"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3001
      NEXUS_DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
    networks:
      - nexus-terminal-network
    restart: unless-stopped

networks:
  nexus-terminal-network:
    driver: bridge
    name: nexus-terminal-network
    enable_ipv6: true
    ipam:
      config:
        - subnet: fd01::/80
          gateway: fd01::1
