services:
  nexus-terminal:
    image: heavrnl/nexus-terminal:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexus-terminal
    # 一个容器、一个端口：后端同时提供 API、WebSocket 与前端静态资源
    ports:
      - "18111:3001"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3001
      NEXUS_DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
    restart: unless-stopped
